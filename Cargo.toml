[package]
name = "typshow"
version = "0.1.10"
edition = "2024"
description = "A PDF presentation viewer with dual-window (audience + presenter) support"
license = "MIT OR Apache-2.0"

[dependencies]
egui = "0.31"
eframe = { version = "0.31", features = ["glow"] }
winit = { version = "0.30", features = ["wayland"] }
parking_lot = "0.12"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
typst = "0.15.0"
typst-render = "0.15.0"
typst-assets = { version = "0.15.0", features = ["fonts"] }
typst-layout = "0.15.0"
fontdb = "0.23"
pulldown-cmark = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
egui-phosphor = "0.9"
