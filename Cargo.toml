[package]
name = "typshow"
version = "0.1.10"
edition = "2024"
description = "A PDF presentation viewer with dual-window (audience + presenter) support"
license = "MIT OR Apache-2.0"

[dependencies]
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
typst = "0.15.0"
typst-render = "0.15.0"
typst-assets = { version = "0.15.0", features = ["fonts"] }
typst-layout = "0.15.0"
fontdb = "0.23"
pulldown-cmark = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "a1f2e21c2c95c6679945d88996e8324a6cc97e47" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a1f2e21c2c95c6679945d88996e8324a6cc97e47", features = ["font-kit", "wayland", "x11"] }
image = "0.25"


[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "a1f2e21c2c95c6679945d88996e8324a6cc97e47", features = ["test-support"] }
# Solo para los tests de `gpui_ui::icons`: verifica que la fuente embebida
# contiene el glifo de cada icono. Ya está en el árbol vía `fontdb`.
ttf-parser = "0.25"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
